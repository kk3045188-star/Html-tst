<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nebula — Modern UI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0a0a1a;
    overflow: hidden;
  }
  /* Animated gradient orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.6;
    animation: float 12s ease-in-out infinite;
  }
  .orb:nth-child(1) { width: 400px; height: 400px; background: #7c3aed; top: -100px; left: -100px; }
  .orb:nth-child(2) { width: 350px; height: 350px; background: #06b6d4; bottom: -80px; right: -80px; animation-delay: -6s; }
  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(40px, -40px) scale(1.1); }
  }

  /* Glass card */
  .card {
    position: relative;
    width: min(420px, 90vw);
    padding: 2.5rem;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
    color: #fff;
    text-align: center;
    animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .badge {
    display: inline-block;
    padding: 0.35rem 0.9rem;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #a5b4fc;
    background: rgba(124, 58, 237, 0.2);
    border: 1px solid rgba(124, 58, 237, 0.4);
    border-radius: 999px;
    margin-bottom: 1.25rem;
  }

  h1 {
    font-size: 2rem;
    font-weight: 700;
    line-height: 1.2;
    background: linear-gradient(90deg, #fff, #a5b4fc);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 0.75rem;
  }

  p {
    color: #94a3b8;
    font-size: 0.95rem;
    line-height: 1.6;
    margin-bottom: 2rem;
  }

  .btn {
    width: 100%;
    padding: 0.9rem 1.5rem;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #7c3aed, #06b6d4);
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(124, 58, 237, 0.45);
  }
  .btn:active { transform: translateY(0); }

  .meta {
    margin-top: 1.25rem;
    font-size: 0.8rem;
    color: #64748b;
  }
</style>
</head>
<body>
  <div class="orb"></div>
  <div class="orb"></div>

  <main class="card">
    <span class="badge">New Release</span>
    <h1>Design Beyond Limits</h1>
    <p>A minimal, glassmorphic UI crafted with pure CSS — no frameworks, no dependencies.</p>
    <button class="btn">Get Started</button>
    <div class="meta">Free forever • No credit card</div>
  </main>
</body>
</html>
